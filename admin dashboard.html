<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MATH-EARTH Admin Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Poppins', sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }
    .title {
      font-size: 1.6rem;
      font-weight: 600;
    }
    .subtitle {
      font-size: 0.9rem;
      color: #9ca3af;
    }
    .back-link a {
      color: #38bdf8;
      text-decoration: none;
      font-size: 0.9rem;
    }
    .back-link a:hover { text-decoration: underline; }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }
    button {
      border: none;
      border-radius: 999px;
      padding: 0.5rem 1.1rem;
      font-size: 0.85rem;
      cursor: pointer;
      font-weight: 500;
    }
    .btn-primary {
      background: linear-gradient(45deg, #22c55e, #16a34a);
      color: white;
    }
    .btn-secondary {
      background: #111827;
      color: #e5e7eb;
      border: 1px solid #374151;
    }
    .btn-danger {
      background: linear-gradient(45deg, #ef4444, #b91c1c);
      color: white;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
      font-size: 0.8rem;
    }
    thead {
      background: #111827;
    }
    th, td {
      padding: 0.5rem 0.4rem;
      border-bottom: 1px solid #1f2937;
      text-align: left;
      vertical-align: top;
    }
    th {
      font-weight: 500;
      color: #e5e7eb;
      white-space: nowrap;
    }
    tr:nth-child(even) td {
      background: #020617;
    }
    tr:hover td {
      background: #0b1120;
    }

    select, input[type="text"] {
      background: #020617;
      border: 1px solid #374151;
      color: #e5e7eb;
      border-radius: 0.375rem;
      padding: 0.2rem 0.35rem;
      font-size: 0.78rem;
    }

    .status-pill {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 500;
    }
    .status-pending {
      background: rgba(234,179,8,0.15);
      color: #facc15;
    }
    .status-approved {
      background: rgba(22,163,74,0.18);
      color: #4ade80;
    }
    .status-rejected {
      background: rgba(248,113,113,0.15);
      color: #f87171;
    }

    .link {
      color: #38bdf8;
      text-decoration: none;
      word-break: break-all;
    }
    .link:hover { text-decoration: underline; }

    .small {
      font-size: 0.75rem;
      color: #9ca3af;
    }

    .badge {
      display: inline-block;
      padding: 0.08rem 0.45rem;
      border-radius: 999px;
      background: #111827;
      border: 1px solid #1f2937;
      font-size: 0.65rem;
      color: #9ca3af;
      margin-left: 0.35rem;
    }

    @media (max-width: 900px) {
      table {
        display: block;
        overflow-x: auto;
        white-space: nowrap;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <div class="title">MATH-EARTH Admin Dashboard</div>
        <div class="subtitle">Review registrations, update status, and send login details</div>
      </div>
      <div class="back-link">
        <a href="index.html">&larr; Back to Home</a>
      </div>
    </div>

    <div class="controls">
      <button class="btn-primary" onclick="loadRegistrations()">Reload Registrations</button>
      <button class="btn-secondary" onclick="loadAnnouncements()">Announcements</button>
      <button class="btn-secondary" onclick="loadEvents()">Events</button>
      <button class="btn-secondary" onclick="loadEventApplications()">Event Applications</button>
    </div>

    <div class="small" id="statusLine">Status: Idle</div>

    <div id="tableContainer">
      <!-- tables will be injected here -->
    </div>
  </div>

  <script>
    // Apps Script backend URL (same as index/register)
    const BACKEND_URL = "https://script.google.com/macros/s/AKfycbwFhm7d1TP9_Z1B4vL__8DMf4RrNku0TLZi6d_1e1Md4fcOtXY9PWovhOjwO6vIdNZDMA/exec";

    function setStatus(msg) {
      document.getElementById('statusLine').textContent = "Status: " + msg;
    }

    async function apiPost(payload) {
      const res = await fetch(BACKEND_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      return res.json();
    }

    function paymentStatusPill(status) {
      if (status === 'Approved') return '<span class="status-pill status-approved">Approved</span>';
      if (status === 'Rejected') return '<span class="status-pill status-rejected">Rejected</span>';
      return '<span class="status-pill status-pending">' + (status || 'Pending') + '</span>';
    }

    function candStatusPill(status) {
      if (status === 'Eligible') return '<span class="status-pill status-approved">Eligible</span>';
      if (status === 'Not Eligible') return '<span class="status-pill status-rejected">Not Eligible</span>';
      return '<span class="status-pill status-pending">' + (status || 'Pending') + '</span>';
    }

    async function loadRegistrations() {
      try {
        setStatus("Loading registrations...");
        const data = await apiPost({ mode: 'listRegistrations' });

        if (!data.success) {
          alert("Failed to load registrations");
          setStatus("Error loading registrations");
          return;
        }

        const regs = data.registrations || [];
        setStatus("Loaded " + regs.length + " registrations");

        let html = '';
        html += '<table>';
        html += '<thead><tr>'
          + '<th>#</th>'
          + '<th>Name / Dept</th>'
          + '<th>Programme / Sem</th>'
          + '<th>Emails</th>'
          + '<th>Contacts</th>'
          + '<th>Docs</th>'
          + '<th>Payment Status</th>'
          + '<th>Candidature</th>'
          + '<th>RegID / Password</th>'
          + '<th>Actions</th>'
          + '</tr></thead><tbody>';

        regs.forEach((r, i) => {
          html += '<tr>';
          html += '<td>' + (i + 1) + '</td>';

          html += '<td><div>' + (r.name || '') + '</div>'
                + '<div class="small">' + (r.dept || '') + '</div></td>';

          html += '<td><div>' + (r.programme || '') + '</div>'
                + '<div class="small">Sem: ' + (r.semester || '') + '</div></td>';

          html += '<td><div class="small">Personal: ' + (r.personalEmail || '') + '</div>'
                + '<div class="small">Univ: ' + (r.univEmail || '') + '</div></td>';

          html += '<td><div class="small">Contact: ' + (r.contact || '') + '</div>'
                + '<div class="small">WhatsApp: ' + (r.whatsapp || '') + '</div></td>';

          html += '<td>';
          if (r.idCardUrl) html += '<div><a class="link" href="' + r.idCardUrl + '" target="_blank">ID Card</a></div>';
          if (r.paymentUrl) html += '<div><a class="link" href="' + r.paymentUrl + '" target="_blank">Payment</a></div>';
          if (r.photoUrl) html += '<div><a class="link" href="' + r.photoUrl + '" target="_blank">Photo</a></div>';
          html += '</td>';

          html += '<td>' + paymentStatusPill(r.paymentStatus) + '</td>';
          html += '<td>' + candStatusPill(r.candStatus) + '</td>';

          html += '<td><div class="small">RegID: ' + (r.regId || '') + '</div>'
                + '<div class="small">Pass: ' + (r.password || '') + '</div></td>';

          html += '<td>'
                + '<select data-regid="' + (r.regId || '') + '" onchange="updateStatus(this)">'
                + '<option value="">Set Status</option>'
                + '<option value="Approved|Eligible">Approve &amp; Eligible</option>'
                + '<option value="Approved|Not Eligible">Approve / Not Eligible</option>'
                + '<option value="Rejected|Not Eligible">Reject</option>'
                + '</select>'
                + '<br>'
                + '<button class="btn-secondary" style="margin-top:0.3rem" onclick="sendLogin(\'' + (r.regId || '') + '\')">Send Login Mail</button>'
                + '</td>';

          html += '</tr>';
        });

        html += '</tbody></table>';
        document.getElementById('tableContainer').innerHTML = html;
      } catch (err) {
        console.error(err);
        alert("Error loading registrations: " + err.message);
        setStatus("Error loading registrations");
      }
    }

    async function updateStatus(sel) {
      const value = sel.value;
      if (!value) return;
      const regId = sel.getAttribute('data-regid');
      if (!regId) return;

      const [payStatus, candStatus] = value.split('|');

      if (!confirm('Update status for RegID ' + regId + ' ?')) {
        sel.value = '';
        return;
      }

      try {
        setStatus("Updating status for " + regId + "...");
        const res = await apiPost({
          mode: 'updateStatus',
          regId: regId,
          paymentStatus: payStatus,
          candStatus: candStatus
        });

        if (!res.success) {
          alert("Failed to update status");
          setStatus("Status update failed");
          return;
        }
        setStatus("Status updated for " + regId);
        loadRegistrations();
      } catch (err) {
        console.error(err);
        alert("Error updating status: " + err.message);
        setStatus("Status update error");
      }
    }

    async function sendLogin(regId) {
      if (!regId) return;
      if (!confirm('Send login mail for RegID ' + regId + ' ?')) return;

      try {
        setStatus("Sending login mail for " + regId + "...");
        const res = await apiPost({ mode: 'sendLoginMail', regId: regId });
        if (!res.success) {
          alert("Failed to send login mail");
          setStatus("Login mail failed");
          return;
        }
        alert("Login mail sent (if email present in sheet).");
        setStatus("Login mail sent for " + regId);
      } catch (err) {
        console.error(err);
        alert("Error sending login mail: " + err.message);
        setStatus("Login mail error");
      }
    }

    async function loadAnnouncements() {
      try {
        setStatus("Loading announcements...");
        const data = await apiPost({ mode: 'listAnnouncements' });
        if (!data.success) {
          alert("Failed to load announcements");
          setStatus("Error loading announcements");
          return;
        }
        const anns = data.announcements || [];

        let html = '<h3 style="margin-top:1rem;margin-bottom:0.5rem;">Announcements</h3>';
        html += '<button class="btn-primary" onclick="openAnnouncementPrompt()">Create Announcement</button>';

        html += '<table><thead><tr><th>Time</th><th>Title</th><th>Body</th></tr></thead><tbody>';
        anns.forEach(a => {
          html += '<tr>'
                + '<td class="small">' + new Date(a.time).toLocaleString() + '</td>'
                + '<td>' + (a.title || '') + '</td>'
                + '<td class="small">' + (a.body || '') + '</td>'
                + '</tr>';
        });
        html += '</tbody></table>';

        document.getElementById('tableContainer').innerHTML = html;
        setStatus("Announcements loaded: " + anns.length);
      } catch (err) {
        console.error(err);
        alert("Error loading announcements: " + err.message);
        setStatus("Announcements error");
      }
    }

    function openAnnouncementPrompt() {
      const title = prompt("Announcement title:");
      if (!title) return;
      const body = prompt("Announcement body:");
      if (!body) return;
      createAnnouncement(title, body);
    }

    async function createAnnouncement(title, body) {
      try {
        setStatus("Creating announcement...");
        const res = await apiPost({ mode: 'createAnnouncement', title: title, body: body });
        if (!res.success) {
          alert("Failed to create announcement");
          setStatus("Announcement create failed");
          return;
        }
        alert("Announcement created.");
        loadAnnouncements();
      } catch (err) {
        console.error(err);
        alert("Error creating announcement: " + err.message);
        setStatus("Announcement create error");
      }
    }

    async function loadEvents() {
      try {
        setStatus("Loading events...");
        const data = await apiPost({ mode: 'listEvents' });
        if (!data.success) {
          alert("Failed to load events");
          setStatus("Events load failed");
          return;
        }
        const evs = data.events || [];

        let html = '<h3 style="margin-top:1rem;margin-bottom:0.5rem;">Events</h3>';
        html += '<button class="btn-primary" onclick="openEventPrompt()">Create Event</button>';

        html += '<table><thead><tr><th>ID</th><th>Name</th><th>Description</th></tr></thead><tbody>';
        evs.forEach(e => {
          html += '<tr>'
                + '<td><span class="badge">' + (e.id || '') + '</span></td>'
                + '<td>' + (e.name || '') + '</td>'
                + '<td class="small">' + (e.desc || '') + '</td>'
                + '</tr>';
        });
        html += '</tbody></table>';

        document.getElementById('tableContainer').innerHTML = html;
        setStatus("Events loaded: " + evs.length);
      } catch (err) {
        console.error(err);
        alert("Error loading events: " + err.message);
        setStatus("Events error");
      }
    }

    function openEventPrompt() {
      const name = prompt("Event name:");
      if (!name) return;
      const desc = prompt("Event description:");
      if (desc === null) return;
      createEvent(name, desc);
    }

    async function createEvent(name, desc) {
      try {
        setStatus("Creating event...");
        const res = await apiPost({ mode: 'createEvent', name: name, desc: desc });
        if (!res.success) {
          alert("Failed to create event");
          setStatus("Event create failed");
          return;
        }
        alert("Event created with ID: " + res.id);
        loadEvents();
      } catch (err) {
        console.error(err);
        alert("Error creating event: " + err.message);
        setStatus("Event create error");
      }
    }

    async function loadEventApplications() {
      try {
        setStatus("Loading event applications...");
        const data = await apiPost({ mode: 'listEventApplications' });
        if (!data.success) {
          alert("Failed to load applications");
          setStatus("Applications load failed");
          return;
        }
        const apps = data.applications || [];

        let html = '<h3 style="margin-top:1rem;margin-bottom:0.5rem;">Event Applications</h3>';
        html += '<table><thead><tr>'
              + '<th>Time</th><th>RegID</th><th>Event</th>'
              + '<th>Team/Solo</th><th>Notes</th>'
              + '<th>Status</th><th>Name</th><th>Email</th>'
              + '</tr></thead><tbody>';

        apps.forEach(a => {
          html += '<tr>'
                + '<td class="small">' + new Date(a.timestamp).toLocaleString() + '</td>'
                + '<td>' + (a.regId || '') + '</td>'
                + '<td>' + (a.eventName || a.eventId || '') + '</td>'
                + '<td class="small">' + (a.team || '') + '</td>'
                + '<td class="small">' + (a.notes || '') + '</td>'
                + '<td class="small">' + (a.status || '') + '</td>'
                + '<td>' + (a.name || '') + '</td>'
                + '<td class="small">' + (a.email || '') + '</td>'
                + '</tr>';
        });
        html += '</tbody></table>';

        document.getElementById('tableContainer').innerHTML = html;
        setStatus("Applications loaded: " + apps.length);
      } catch (err) {
        console.error(err);
        alert("Error loading applications: " + err.message);
        setStatus("Applications error");
      }
    }

    // Auto-load registrations on page open
    loadRegistrations();
  </script>
</body>
</html>
